<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget Planner</title>
  <meta name="theme-color" content="#FAFAFA">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Poppins:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Desktop und Tablet: Seitenleiste -->
  <aside class="sidebar" aria-label="Seitenleiste">
    <a class="brand" href="#dashboard" aria-label="Budget Planner, zum Dashboard">
      <span class="brand-logo" aria-hidden="true">B</span>
      <span class="brand-text">Budget Planner</span>
    </a>
    <nav class="side-nav" aria-label="Hauptnavigation" data-nav></nav>
    <div class="sidebar-foot">
      <a class="nav-btn help-link" href="/hilfe" title="Hilfe &amp; Anleitung">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
        <span>Hilfe &amp; Anleitung</span>
      </a>
      <span class="save-state" data-save-state aria-live="polite"></span>
      <a class="user-chip" href="#profile" title="Profil">
        <span class="avatar" data-user-initial aria-hidden="true"></span>
        <span class="user-text">
          <strong data-user-name></strong>
          <small data-user-email></small>
        </span>
      </a>
    </div>
  </aside>

  <!-- Handy: Topbar -->
  <header class="topbar">
    <a class="brand" href="#dashboard" aria-label="Budget Planner, zum Dashboard">
      <span class="brand-logo" aria-hidden="true">B</span>
      <span class="brand-text">Budget Planner</span>
    </a>
    <div class="quick-actions">
      <button type="button" class="icon-btn accent" data-action="add-income" aria-label="Einnahme hinzufügen" data-icon="plus"></button>
      <button type="button" class="icon-btn" data-action="add-expense" aria-label="Ausgabe hinzufügen" data-icon="minus"></button>
    </div>
  </header>

  <main class="main" id="view">
    <div class="loading">Lade dein Budget …</div>
  </main>

  <!-- Handy: Bottom-Navigation -->
  <nav class="bottom-nav" aria-label="Hauptnavigation" data-nav></nav>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts"></div>
</body>
</html>
